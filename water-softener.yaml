################################################################################
# Clack WS1 TT Duplex — ESPHome Configuration
# Board: ESP32-C3 Super Mini
#
# All system values (tank capacity, brine tank height, regen cycle times,
# flow meter pulses-per-litre) are configurable from Home Assistant — no
# reflashing required after initial setup.
#
# Wiring (ESP32-C3 Super Mini):
#
#   Clack relay dry contact (RLY1 + COM):
#     COM  → ESP GND
#     RLY1 → GPIO1  (internal pull-up, active LOW)
#
#   Clack METER connector (tap GND + white signal wire only):
#     Black (GND)   → ESP GND
#     White (pulse) → voltage divider → GPIO0
#                     [White → 10kΩ → GPIO0 → 15kΩ → GND]
#
#   AJ-SR04M ultrasonic sensor (UART mode, R19 jumper present):
#     VCC     → ESP 5V
#     GND     → ESP GND
#     TX/ECHO → voltage divider → GPIO10 (ESP RX)
#               [TX → 10kΩ → GPIO10 → 15kΩ → GND]
#     RX/TRIG → GPIO3 (ESP TX, direct — 3.3V signal)
#
#   Salt fill button (momentary, NO):
#     One terminal → GPIO2
#     Other terminal → GND
#
#   Configure relay in Clack controller menu:
#     NEXT + DOWN → RELAY → Set Time on
#     Actuation delay: 0s, Duration: full regen time (e.g. 90 min)
#
################################################################################

esphome:
  name: water-softener-monitor
  friendly_name: Water Softener

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "WaterSoftener"
    password: !secret ap_password

improv_serial:

captive_portal:

# ── Time ──────────────────────────────────────────────────────────────────────
time:
  - platform: homeassistant
    id: sntp_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - globals.set:
              id: daily_usage_l
              value: "0.0"

# ── UART for AJ-SR04M ─────────────────────────────────────────────────────────
uart:
  id: uart_jsn
  rx_pin: GPIO10
  tx_pin: GPIO3
  baud_rate: 9600

# ── AJ-SR04M polling ──────────────────────────────────────────────────────────
interval:
  - interval: 5s
    then:
      - if:
          condition:
            lambda: return (millis() - id(last_brine_poll_ms)) >= (uint32_t)(id(brine_interval).state * 1000.0f);
          then:
            - lambda: |-
                id(last_brine_poll_ms) = millis();
                id(uart_jsn).write_byte(0x55);
            - delay: 300ms
            - lambda: |-
                std::string resp;
                while (id(uart_jsn).available()) {
                  uint8_t b;
                  id(uart_jsn).read_byte(&b);
                  if (b != '\r' && b != '\n')
                    resp += (char)b;
                }
                auto gap = resp.find("Gap=");
                auto mm  = resp.find("mm");
                if (gap != std::string::npos && mm != std::string::npos && mm > gap + 4) {
                  float d = atof(resp.substr(gap + 4, mm - gap - 4).c_str()) / 1000.0f;
                  if (d > 0.01f && d < 5.0f) {
                    id(brine_distance).publish_state(d);
                    float usable = id(tank_height).state - id(full_distance).state;
                    id(brine_level_live).publish_state(clamp(((id(tank_height).state - d) / usable) * 100.0f, 0.0f, 100.0f));
                    if (id(regen_active_sensor).state && d > id(max_regen_dist))
                      id(max_regen_dist) = d;
                  }
                }

# ── Configurable values (set from HA, no reflash needed) ──────────────────────
number:
  - platform: template
    name: "Resin Capacity Per Tank"
    id: resin_capacity
    unit_of_measurement: "L"
    icon: "mdi:water-percent"
    min_value: 100
    max_value: 20000
    step: 100
    restore_value: true
    initial_value: 2000
    optimistic: true

  - platform: template
    name: "Brine Tank Height"
    id: tank_height
    unit_of_measurement: "m"
    icon: "mdi:ruler"
    min_value: 0.10
    max_value: 3.00
    step: 0.01
    restore_value: true
    initial_value: 0.70
    optimistic: true

  - platform: template
    name: "Brine Tank Full Distance"
    id: full_distance
    unit_of_measurement: "m"
    icon: "mdi:arrow-collapse-up"
    min_value: 0.05
    max_value: 0.50
    step: 0.01
    restore_value: true
    initial_value: 0.20
    optimistic: true

  - platform: template
    name: "Flow Meter Pulses Per Litre"
    id: meter_ppl
    unit_of_measurement: "p/L"
    icon: "mdi:pulse"
    min_value: 1
    max_value: 1000
    step: 1
    restore_value: true
    initial_value: 16
    optimistic: true

  - platform: template
    name: "Backwash Duration"
    id: dur_backwash
    unit_of_measurement: "min"
    icon: "mdi:timer"
    min_value: 1
    max_value: 60
    step: 1
    restore_value: true
    initial_value: 10
    optimistic: true

  - platform: template
    name: "Brine Draw Duration"
    id: dur_brine_draw
    unit_of_measurement: "min"
    icon: "mdi:timer"
    min_value: 1
    max_value: 120
    step: 1
    restore_value: true
    initial_value: 60
    optimistic: true

  - platform: template
    name: "Fast Rinse Duration"
    id: dur_fast_rinse
    unit_of_measurement: "min"
    icon: "mdi:timer"
    min_value: 1
    max_value: 60
    step: 1
    restore_value: true
    initial_value: 10
    optimistic: true

  - platform: template
    name: "Brine Fill Duration"
    id: dur_brine_fill
    unit_of_measurement: "min"
    icon: "mdi:timer"
    min_value: 1
    max_value: 60
    step: 1
    restore_value: true
    initial_value: 10
    optimistic: true

  - platform: template
    name: "Brine Sensor Update Interval"
    id: brine_interval
    unit_of_measurement: "s"
    icon: "mdi:timer-refresh"
    min_value: 5
    max_value: 300
    step: 5
    restore_value: true
    initial_value: 30
    optimistic: true

  - platform: template
    name: "Salt Low Threshold"
    id: salt_low_pct
    unit_of_measurement: "%"
    icon: "mdi:shaker-outline"
    min_value: 5
    max_value: 80
    step: 5
    restore_value: true
    initial_value: 40
    optimistic: true

  - platform: template
    name: "Salt Warning Threshold"
    id: salt_warning_pct
    unit_of_measurement: "%"
    icon: "mdi:shaker-outline"
    min_value: 5
    max_value: 80
    step: 5
    restore_value: true
    initial_value: 20
    optimistic: true

# ── Globals ───────────────────────────────────────────────────────────────────
globals:
  - id: tank_in_service
    type: int
    restore_value: true
    initial_value: "0"

  - id: regen_start_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: tank_a_remaining
    type: float
    restore_value: true
    initial_value: "2000"

  - id: tank_b_remaining
    type: float
    restore_value: true
    initial_value: "2000"

  - id: daily_usage_l
    type: float
    restore_value: false
    initial_value: "0"

  - id: total_usage_l
    type: float
    restore_value: true
    initial_value: "0"

  - id: last_regen_a
    type: uint32_t
    restore_value: true
    initial_value: "0"

  - id: last_regen_b
    type: uint32_t
    restore_value: true
    initial_value: "0"

  - id: last_brine_poll_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: max_regen_dist
    type: float
    restore_value: false
    initial_value: "0.0"

  - id: salt_level_pct
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: salt_level_updated
    type: uint32_t
    restore_value: true
    initial_value: "0"

# ── Sensors ───────────────────────────────────────────────────────────────────
sensor:

  - platform: pulse_meter
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
    id: flow_pulse_raw
    internal: true
    internal_filter: 50ms
    timeout: 5s
    on_value:
      then:
        - lambda: |-
            float vol = 1.0f / id(meter_ppl).state;
            id(daily_usage_l) += vol;
            id(total_usage_l) += vol;
            if (id(tank_in_service) == 0)
              id(tank_a_remaining) = max(0.0f, id(tank_a_remaining) - vol);
            else
              id(tank_b_remaining) = max(0.0f, id(tank_b_remaining) - vol);

  - platform: template
    name: "Flow Rate"
    id: flow_rate_sensor
    unit_of_measurement: "L/min"
    device_class: volume_flow_rate
    icon: "mdi:water"
    update_interval: 10s
    lambda: return id(flow_pulse_raw).state / id(meter_ppl).state;

  - platform: template
    name: "Daily Usage"
    unit_of_measurement: "L"
    device_class: water
    state_class: total_increasing
    icon: "mdi:water"
    update_interval: 60s
    lambda: return id(daily_usage_l);

  - platform: template
    name: "Total Usage"
    unit_of_measurement: "L"
    device_class: water
    state_class: total_increasing
    icon: "mdi:water"
    update_interval: 60s
    lambda: return id(total_usage_l);

  - platform: template
    name: "Tank A Capacity Remaining"
    id: tank_a_capacity_sensor
    unit_of_measurement: "L"
    icon: "mdi:water-percent"
    update_interval: 30s
    lambda: return id(tank_a_remaining);

  - platform: template
    name: "Tank B Capacity Remaining"
    id: tank_b_capacity_sensor
    unit_of_measurement: "L"
    icon: "mdi:water-percent"
    update_interval: 30s
    lambda: return id(tank_b_remaining);

  - platform: template
    name: "Tank A Capacity Percent"
    unit_of_measurement: "%"
    update_interval: 30s
    lambda: return (id(tank_a_remaining) / id(resin_capacity).state) * 100.0f;

  - platform: template
    name: "Tank B Capacity Percent"
    unit_of_measurement: "%"
    update_interval: 30s
    lambda: return (id(tank_b_remaining) / id(resin_capacity).state) * 100.0f;

  - platform: template
    name: "Regen Time Remaining"
    unit_of_measurement: "min"
    update_interval: 60s
    lambda: |-
      if (!id(regen_active_sensor).state) return 0.0f;
      int total = (int)(id(dur_backwash).state + id(dur_brine_draw).state +
                        id(dur_fast_rinse).state + id(dur_brine_fill).state);
      int elapsed = (int)((millis() - id(regen_start_ms)) / 60000);
      return (float)max(0, total - elapsed);

  - platform: template
    name: "Brine Tank Distance"
    id: brine_distance
    unit_of_measurement: "m"
    icon: "mdi:arrow-expand-vertical"
    accuracy_decimals: 3
    update_interval: never
    lambda: return {};

  - platform: template
    name: "Brine Tank Level Live"
    id: brine_level_live
    unit_of_measurement: "%"
    update_interval: never
    lambda: return {};

  - platform: template
    name: "Brine Lowest Regen Level"
    unit_of_measurement: "%"
    icon: "mdi:arrow-collapse-down"
    update_interval: 30s
    lambda: |-
      if (id(max_regen_dist) < 0.01f) return {};
      float usable = id(tank_height).state - id(full_distance).state;
      float pct = ((id(tank_height).state - id(max_regen_dist)) / usable) * 100.0f;
      return clamp(pct, 0.0f, 100.0f);

  - platform: template
    name: "Salt Level"
    id: salt_level_sensor
    unit_of_measurement: "%"
    icon: "mdi:shaker-outline"
    update_interval: 30s
    lambda: |-
      if (id(salt_level_updated) == 0) return {};
      return id(salt_level_pct);

# ── Binary sensors ────────────────────────────────────────────────────────────
binary_sensor:

  - platform: gpio
    pin:
      number: GPIO1
      mode:
        input: true
        pullup: true
      inverted: true
    id: regen_active_sensor
    name: "Regeneration Active"
    device_class: running
    filters:
      - delayed_on: 3s
      - delayed_off: 10s
    on_press:
      then:
        - lambda: |-
            id(regen_start_ms) = millis();
            id(max_regen_dist) = 0.0f;
            auto t = id(sntp_time).now();
            if (id(tank_in_service) == 0) {
              id(tank_in_service) = 1;
              if (t.is_valid()) id(last_regen_a) = (uint32_t)t.timestamp;
            } else {
              id(tank_in_service) = 0;
              if (t.is_valid()) id(last_regen_b) = (uint32_t)t.timestamp;
            }
    on_release:
      then:
        - lambda: |-
            if (id(tank_in_service) == 1)
              id(tank_a_remaining) = id(resin_capacity).state;
            else
              id(tank_b_remaining) = id(resin_capacity).state;
            if (id(max_regen_dist) > 0.01f) {
              float usable = id(tank_height).state - id(full_distance).state;
              float pct = ((id(tank_height).state - id(max_regen_dist)) / usable) * 100.0f;
              id(salt_level_pct) = clamp(pct, 0.0f, 100.0f);
              auto t = id(sntp_time).now();
              id(salt_level_updated) = t.is_valid() ? (uint32_t)t.timestamp : 1;
              id(salt_level_sensor).publish_state(id(salt_level_pct));
              id(salt_level_updated_sensor).publish_state(
                id(salt_level_updated) > 1
                  ? id(sntp_time).now().strftime("%Y-%m-%dT%H:%M:%S")
                  : std::string("set (no timestamp)")
              );
            }

  - platform: gpio
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Salt Fill Button"
    internal: true
    filters:
      - delayed_on: 50ms
    on_press:
      then:
        - lambda: |-
            if (!isnan(id(brine_distance).state) && id(brine_distance).state > 0.01f) {
              float usable = id(tank_height).state - id(full_distance).state;
              float pct = ((id(tank_height).state - id(brine_distance).state) / usable) * 100.0f;
              id(salt_level_pct) = clamp(pct, 0.0f, 100.0f);
              auto t = id(sntp_time).now();
              id(salt_level_updated) = t.is_valid() ? (uint32_t)t.timestamp : 1;
              id(salt_level_sensor).publish_state(id(salt_level_pct));
              id(salt_level_updated_sensor).publish_state(
                id(salt_level_updated) > 1
                  ? id(sntp_time).now().strftime("%Y-%m-%dT%H:%M:%S")
                  : std::string("set (no timestamp)")
              );
            }

# ── Text sensors ──────────────────────────────────────────────────────────────
text_sensor:

  - platform: template
    name: "Tank In Service"
    update_interval: 10s
    lambda: |-
      return id(tank_in_service) == 0
        ? std::string("Tank A")
        : std::string("Tank B");

  - platform: template
    name: "Regen Stage"
    update_interval: 30s
    lambda: |-
      if (!id(regen_active_sensor).state) return std::string("Idle");
      int elapsed = (int)((millis() - id(regen_start_ms)) / 60000);
      int t1 = (int)id(dur_backwash).state;
      int t2 = t1 + (int)id(dur_brine_draw).state;
      int t3 = t2 + (int)id(dur_fast_rinse).state;
      int t4 = t3 + (int)id(dur_brine_fill).state;
      if (elapsed < t1) return std::string("Backwash");
      if (elapsed < t2) return std::string("Brine Draw");
      if (elapsed < t3) return std::string("Fast Rinse");
      if (elapsed < t4) return std::string("Brine Fill");
      return std::string("Completing");

  - platform: template
    name: "Tank A Last Regen"
    update_interval: 60s
    lambda: |-
      if (id(last_regen_a) == 0) return std::string("unknown");
      time_t ts = (time_t)id(last_regen_a);
      char buf[20];
      strftime(buf, sizeof(buf), "%Y-%m-%dT%H:%M:%S", localtime(&ts));
      return std::string(buf);

  - platform: template
    name: "Tank B Last Regen"
    update_interval: 60s
    lambda: |-
      if (id(last_regen_b) == 0) return std::string("unknown");
      time_t ts = (time_t)id(last_regen_b);
      char buf[20];
      strftime(buf, sizeof(buf), "%Y-%m-%dT%H:%M:%S", localtime(&ts));
      return std::string(buf);

  - platform: template
    name: "Salt Level Last Updated"
    id: salt_level_updated_sensor
    update_interval: 60s
    lambda: |-
      if (id(salt_level_updated) == 0) return std::string("never");
      if (id(salt_level_updated) == 1) return std::string("set (no timestamp)");
      time_t ts = (time_t)id(salt_level_updated);
      char buf[20];
      strftime(buf, sizeof(buf), "%Y-%m-%dT%H:%M:%S", localtime(&ts));
      return std::string(buf);

  - platform: template
    name: "Salt Level Status"
    update_interval: 60s
    lambda: |-
      if (id(salt_level_updated) == 0) return std::string("unknown");
      if (id(salt_level_pct) > id(salt_low_pct).state) return std::string("OK");
      if (id(salt_level_pct) > id(salt_warning_pct).state) return std::string("Low");
      return std::string("Warning");

  - platform: wifi_info
    ip_address:
      name: "IP"

# ── Button ────────────────────────────────────────────────────────────────────
button:
  - platform: template
    name: "Update Salt Level"
    icon: "mdi:shaker"
    on_press:
      then:
        - lambda: |-
            if (!isnan(id(brine_distance).state) && id(brine_distance).state > 0.01f) {
              float usable = id(tank_height).state - id(full_distance).state;
              float pct = ((id(tank_height).state - id(brine_distance).state) / usable) * 100.0f;
              id(salt_level_pct) = clamp(pct, 0.0f, 100.0f);
              auto t = id(sntp_time).now();
              id(salt_level_updated) = t.is_valid() ? (uint32_t)t.timestamp : 1;
              id(salt_level_sensor).publish_state(id(salt_level_pct));
              id(salt_level_updated_sensor).publish_state(
                id(salt_level_updated) > 1
                  ? id(sntp_time).now().strftime("%Y-%m-%dT%H:%M:%S")
                  : std::string("set (no timestamp)")
              );
            }

# ── Status LED ────────────────────────────────────────────────────────────────
status_led:
  pin:
    number: GPIO8
    inverted: true
